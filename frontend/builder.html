<!DOCTYPE html>
<html>
<head>
  <link href="https://unpkg.com/survey-core/survey-core.min.css" rel="stylesheet"/>
  <link href="https://unpkg.com/survey-creator-core/survey-creator-core.min.css" rel="stylesheet"/>

  <script src="https://unpkg.com/survey-core/survey.core.min.js"></script>
  <script src="https://unpkg.com/survey-creator-js/survey-creator-js.min.js"></script>
</head>
<body>

<h2>Создание формы</h2>

<input id="title" placeholder="Название"><br>
<input id="type" placeholder="Тип формы"><br>
<input id="reason" placeholder="Основание"><br>

<div id="creator"></div>

<button onclick="save()">Сохранить</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
const supabase = window.supabase.createClient(
  "https://YOUR_PROJECT.supabase.co",
  "PUBLIC_ANON_KEY"
);

async function save() {
  const schema = creator.JSON;

  await supabase.from("forms").insert({
    title: document.getElementById("title").value,
    form_type: document.getElementById("type").value,
    form_reason: document.getElementById("reason").value,
    schema
  });

  alert("Сохранено");
}
</script>

</body>
</html>
