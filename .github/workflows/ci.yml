name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan repository for security issues
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  test:
    # Playwright 1.58.2 provides Chromium dependencies for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-anon-key
      VITE_SUPABASE_STORAGE_BUCKET: survey-files

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mail-worker/package-lock.json
            office-service/package-lock.json

      - name: Validate repository policies and migrations
        run: node --test database/supabase_schema.test.mjs database/migrations.test.mjs functions/user-admin/index.test.mjs functions/form-admin/index.test.mjs functions/mail-admin/index.test.mjs frontend/tooling.test.mjs frontend/scripts/check-bundle-budget.test.mjs frontend/Dockerfile.test.mjs mail-worker/Dockerfile.test.mjs office-service/Dockerfile.test.mjs

      - name: Test backup layout and retention
        run: python3 -m unittest discover -s ops -p 'test_*.py'

      - name: Install, audit and test Office service
        working-directory: office-service
        run: npm ci && npm audit --omit=dev --audit-level=high && npm test

      - name: Test Office service PostgreSQL job integration
        env:
          PGPASSWORD: integration-test-only
          OFFICE_TEST_DATABASE_URL: postgresql://postgres:integration-test-only@127.0.0.1:5432/office_integration_test
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            r record;
          begin
            for r in select unnest(array['anon','authenticated','service_role']) as n loop
              if not exists (select 1 from pg_roles where rolname = r.n) then
                execute format('create role %I nologin %s', r.n, case when r.n = 'service_role' then 'bypassrls' else '' end);
              end if;
            end loop;
          end $$;
          SQL
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "drop database if exists office_integration_test;" -c "create database office_integration_test template template0;"
          psql "$OFFICE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create table auth.users(id uuid primary key,email text,raw_user_meta_data jsonb default '{}',banned_until timestamptz);
          create function auth.uid() returns uuid language sql stable as $$ select nullif(current_setting('request.jwt.claim.sub',true),'')::uuid $$;
          grant usage on schema auth to anon,authenticated,service_role;
          create schema storage;
          create table storage.buckets(id text primary key,name text,public boolean,file_size_limit bigint,allowed_mime_types text[]);
          create table storage.objects(id uuid default gen_random_uuid() primary key,bucket_id text references storage.buckets(id),name text,owner uuid,metadata jsonb,user_metadata jsonb,created_at timestamptz default now(),updated_at timestamptz default now(),version text);
          alter table storage.objects enable row level security;
          grant usage on schema storage to anon,authenticated,service_role;
          grant all on storage.buckets,storage.objects to service_role;
          grant select,insert,update,delete on storage.objects to anon,authenticated;
          create publication supabase_realtime;
          SQL
          psql "$OFFICE_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/supabase_schema.sql >/dev/null
          node --test office-service/test/jobs.integration.test.mjs
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "drop database if exists office_integration_test;"

      - name: Install mail worker dependencies
        working-directory: mail-worker
        run: npm ci

      - name: Test SQL contracts and concurrent file lifecycle
        env:
          SURVEY_TEST_DATABASE_URL: postgresql://postgres:integration-test-only@127.0.0.1:5432/postgres
        run: node --test --test-concurrency=1 database/integration.test.mjs database/public_http.test.mjs

      - name: Audit and test mail worker
        working-directory: mail-worker
        run: npm audit --omit=dev --audit-level=high && npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm run audit:prod

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend with coverage gate
        working-directory: frontend
        run: npm run test:coverage

      - name: Test Edge Function authorization and origin behavior
        run: node --test functions/security-boundaries.test.mjs functions/form-admin/upload-policy.test.mjs functions/app-settings/index.test.mjs functions/app-settings/favicon.test.mjs functions/mail-admin/composer.test.mjs functions/mail-admin/settings.test.mjs

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check frontend bundle budget
        working-directory: frontend
        run: npm run build:budget

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Gate end-to-end smoke tests
        working-directory: frontend
        run: npm run test:e2e
