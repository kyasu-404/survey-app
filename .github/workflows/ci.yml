name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Scan repository for security issues
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  test:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ci-anon-key
      VITE_SUPABASE_STORAGE_BUCKET: survey-files

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mail-worker/package-lock.json

      - name: Validate repository policies and migrations
        run: node --test database/supabase_schema.test.mjs database/migrations.test.mjs functions/user-admin/index.test.mjs functions/form-admin/index.test.mjs functions/mail-admin/index.test.mjs frontend/tooling.test.mjs frontend/Dockerfile.test.mjs mail-worker/Dockerfile.test.mjs

      - name: Install mail worker dependencies
        working-directory: mail-worker
        run: npm ci

      - name: Audit and test mail worker
        working-directory: mail-worker
        run: npm audit --omit=dev && npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm run audit:prod

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend with coverage gate
        working-directory: frontend
        run: npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check frontend bundle budget
        working-directory: frontend
        run: npm run build:budget

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Gate end-to-end smoke tests
        working-directory: frontend
        run: npm run test:e2e
