# /etc/nginx/conf.d/app.conf

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

limit_req_zone $binary_remote_addr zone=survey_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=survey_responses:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=survey_uploads:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=survey_connections:10m;

upstream app_api {
  server 127.0.0.1:8000;   # пример TCP upstream
  keepalive 32;
}

upstream app_ws {
  server 127.0.0.1:8000;   # если WS на том же сервисе; иначе отдельный port/service
  keepalive 32;
}

server {
  listen 443 ssl http2;
  server_name example.com;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  # базовые заголовки безопасности
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss:; form-action 'self'; frame-src 'none'; manifest-src 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

  # лимиты под ваши формы/файлы
  client_max_body_size 10m;
  limit_conn survey_connections 30;

  # --- FRONT ---
  root /var/www/survey-app/frontend/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- API reverse proxy ---
  location ^~ /api/ {
    limit_req zone=survey_api burst=40 nodelay;
    proxy_pass http://app_api/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # таймауты под вашу нагрузку
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # буферизация (по умолчанию включена; выключать без причины — частая ошибка)
    proxy_buffering on;
  }

  # Anonymous uploads are intentionally available for public forms. Keep a
  # separate, stricter per-client budget so one source cannot rapidly consume
  # the form-wide Storage quota. Do not expose Kong directly in production.
  location ^~ /api/storage/v1/object/survey-files/ {
    limit_req zone=survey_uploads burst=5 nodelay;
    proxy_pass http://app_api/storage/v1/object/survey-files/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location = /api/rest/v1/responses {
    limit_req zone=survey_responses burst=6 nodelay;
    proxy_pass http://app_api/rest/v1/responses;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # --- WebSocket proxy ---
  location ^~ /realtime/ {
    proxy_pass http://app_ws;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
  }
}
