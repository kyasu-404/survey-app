# /etc/nginx/conf.d/app.conf

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream app_api {
  server 127.0.0.1:8000;   # пример TCP upstream
  keepalive 32;
}

upstream app_ws {
  server 127.0.0.1:8000;   # если WS на том же сервисе; иначе отдельный port/service
  keepalive 32;
}

server {
  listen 443 ssl http2;
  server_name example.com;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  # базовые заголовки безопасности
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;

  # лимиты под ваши формы/файлы
  client_max_body_size 20m;

  # --- FRONT ---
  root /var/www/survey-app/frontend/dist;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- API reverse proxy ---
  location ^~ /api/ {
    proxy_pass http://app_api/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # таймауты под вашу нагрузку
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # буферизация (по умолчанию включена; выключать без причины — частая ошибка)
    proxy_buffering on;
  }

  # --- WebSocket proxy ---
  location ^~ /realtime/ {
    proxy_pass http://app_ws/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;
  }
}
