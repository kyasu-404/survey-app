server {
    listen 80;
    server_name your-domain.com;

    root /var/www/survey-app/frontend/dist;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # если нужно проксировать Supabase API
    location /api/ {
        proxy_pass http://localhost:8000/;
    }
}
