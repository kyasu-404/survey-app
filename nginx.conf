# /etc/nginx/conf.d/app.conf

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server_tokens off;
limit_req_status 429;

# OPTIONS is a browser preflight, not an application operation. Keep aggregate
# IP budgets (never trust a caller-supplied identity) sized for a shared office.
map $request_method $survey_api_key {
  default $binary_remote_addr;
  OPTIONS "";
}
map $request_method $survey_upload_key {
  default "";
  POST $binary_remote_addr;
  PUT $binary_remote_addr;
  PATCH $binary_remote_addr;
  DELETE $binary_remote_addr;
}
map $uri $survey_static_cache_control {
  default "no-cache";
  "~^/assets/.+-[A-Za-z0-9_-]{8,}\.[a-z0-9]+$" "public, max-age=31536000, immutable";
}

# New zone names allow a graceful reload from the old binary_remote_addr key.
limit_req_zone $survey_api_key zone=survey_api_v2:10m rate=100r/s;
limit_req_zone $survey_api_key zone=survey_responses_v2:10m rate=20r/s;
limit_req_zone $survey_upload_key zone=survey_uploads_v2:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=survey_connections:10m;

upstream app_api {
  server 127.0.0.1:8000;   # пример TCP upstream
  keepalive 32;
}

upstream app_ws {
  server 127.0.0.1:8000;   # если WS на том же сервисе; иначе отдельный port/service
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name example.com;

  ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # базовые заголовки безопасности
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https: wss:; form-action 'self'; frame-src 'none'; manifest-src 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

  add_header Cache-Control $survey_static_cache_control;

  # лимиты под ваши формы/файлы
  client_max_body_size 10m;
  client_body_timeout 30s;
  client_header_timeout 15s;
  keepalive_timeout 65s;
  limit_conn survey_connections 256;

  # --- FRONT ---
  root /var/www/survey-app/frontend/dist;
  index index.html;

  location ^~ /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Response submission is an RPC, so the dedicated budget must match the actual
  # PostgREST route. The generic /api/ location is deliberately less strict.
  location = /api/rest/v1/rpc/submit_form_response {
    limit_req zone=survey_responses_v2 burst=200 nodelay;
    limit_except POST OPTIONS { deny all; }
    proxy_pass http://app_api/rest/v1/rpc/submit_form_response;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Anonymous uploads are intentionally available for public forms. Keep a
  # separate per-IP write budget so one source cannot rapidly consume
  # the form-wide Storage quota. Do not expose Kong directly in production.
  location ^~ /api/storage/v1/object/survey-files/ {
    limit_req zone=survey_uploads_v2 burst=200 nodelay;
    proxy_pass http://app_api/storage/v1/object/survey-files/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Supabase client is configured with the /api base path, therefore Realtime
  # connects to /api/realtime/v1/* and needs an explicit Upgrade route.
  location ^~ /api/realtime/ {
    limit_req zone=survey_api_v2 burst=400 nodelay;
    proxy_pass http://app_ws/realtime/;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # --- API reverse proxy ---
  location ^~ /api/ {
    limit_req zone=survey_api_v2 burst=400 nodelay;
    proxy_pass http://app_api/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering on;
  }
}
