<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Данные формы</title><link rel="stylesheet" href="plugin.css"><script src="plugins.js"></script><script defer src="plugin.js"></script></head><body><div id="plugin-scroll" role="region" aria-label="Поля макета" tabindex="0">
<header><h1>Данные формы</h1><p id="instructions">Выберите место в макете, затем вопрос.</p></header>
<p id="status" role="status">Подключение к форме…</p><div id="error" role="alert" hidden></div>
<main id="main" hidden><input id="search" type="search" placeholder="Найти вопрос…" aria-label="Найти вопрос">

<section class="bindings-section"><h2 id="binding-count">Поля макета</h2><button id="check" class="primary">Проверить макет</button><div id="bindings"></div><p class="hint">Сохраните макет и вернитесь к результатам. «Сформировать документы» создаст отдельный файл для каждого ответа. Макет сохранится без изменений.</p></section>
</main></div></body></html>
